name: LitgramMessenger
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    COMPILER_INDEX_STORE_ENABLE: NO
targets:
  LitgramMessenger:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.litgram.messenger
    sources:
      - path: Sources/App
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/nft_catalog.json
      - path: Resources/NftThumbs
    info:
      path: Sources/App/Info.plist
